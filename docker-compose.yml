version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: fire-extinguisher-db
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
      POSTGRES_DB: fire_extinguisher_system
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U admin']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - fire-network

  redis:
    image: redis:7-alpine
    container_name: fire-extinguisher-redis
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - fire-network

volumes:
  postgres_data:

networks:
  fire-network:
    driver: bridge
